[pytest]
# Python 3.14 + pytest-9 stdout capture incompatibility workaround.
# The TextIOWrapper wrapping in pipeline scripts causes I/O on closed file
# at teardown when pytest capture is enabled. --capture=no avoids this.
addopts = -s --capture=no
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
